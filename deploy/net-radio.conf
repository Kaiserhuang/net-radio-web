server {
    listen 443 ssl http2;
    server_name radio.example.com;

    ssl_certificate     /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;

    # 静态文件由 Nginx 直接服务
    location /static/ {
        alias /var/www/net-radio/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 根路径
    location / {
        root /var/www/net-radio/static/;
        try_files $uri /static/index.html;
    }
}

server {
    listen 80;
    server_name radio.example.com;
    return 301 https://$server_name$request_uri;
}
