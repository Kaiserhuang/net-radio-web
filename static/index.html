<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白泽网络电台</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #070b1a;
  --surface: #0f1629;
  --surface2: #1a2340;
  --border: #1e2d5a;
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --green: #00ff88;
  --text: #e8edf5;
  --text2: #8892b0;
  --text3: #4a5478;
  --radius: 12px;
  --shadow: 0 4px 30px rgba(0,0,0,0.5);
  --glow: 0 0 20px rgba(0,212,255,0.15);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  background: rgba(15,22,41,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.logo small { font-size: 13px; font-weight: 400; opacity: 0.6; -webkit-text-fill-color: var(--text2); }
.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus { border-color: var(--accent); box-shadow: var(--glow); }
.search-box::before {
  content: '\1F50D';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.5;
}
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-btn {
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  white-space: nowrap;
}
.header-btn:hover { border-color: var(--accent); color: var(--accent); }
.header-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.08); }
.fav-count {
  font-size: 11px;
  background: var(--accent);
  color: var(--bg);
  border-radius: 10px;
  padding: 1px 6px;
  margin-left: 4px;
}

/* Layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0;
  flex-shrink: 0;
}
.sidebar-section { margin-bottom: 4px; }
.sidebar-title {
  padding: 8px 16px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.cat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px 7px 20px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  transition: all 0.15s;
  border-left: 3px solid transparent;
  user-select: none;
}
.cat-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.cat-item.active { color: var(--accent); background: rgba(0,212,255,0.06); border-left-color: var(--accent); }
.cat-item .arrow {
  font-size: 10px;
  transition: transform 0.2s;
  width: 14px;
  text-align: center;
  flex-shrink: 0;
}
.cat-item .arrow.open { transform: rotate(90deg); }
.cat-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-item .badge {
  font-size: 11px;
  color: var(--text3);
  background: rgba(255,255,255,0.04);
  padding: 1px 7px;
  border-radius: 10px;
}
.sub-items { display: none; }
.sub-items.open { display: block; }
.sub-item {
  padding: 6px 16px 6px 42px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  transition: all 0.15s;
  border-left: 3px solid transparent;
  user-select: none;
}
.sub-item:hover { color: var(--text); background: rgba(255,255,255,0.02); }
.sub-item.active { color: var(--accent); border-left-color: var(--accent); }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 140px;
  position: relative;
}
.content-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--text3);
  font-size: 15px;
}
.content-header {
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.content-header h2 { font-size: 20px; font-weight: 600; }
.content-header .total { font-size: 13px; color: var(--text3); }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab {
  padding: 6px 18px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.tab:hover { border-color: var(--text3); color: var(--text); }
.tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

/* Cards Grid */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: all 0.25s;
  cursor: pointer;
  position: relative;
}
.card:hover { border-color: var(--accent); box-shadow: var(--glow); transform: translateY(-1px); }
.card.playing { border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,136,0.1); }
.card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card-name .playing-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: none; }
.card.playing .card-name .playing-indicator { display: inline-block; }
.card-meta { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
.card-actions { display: flex; gap: 6px; }
.card-btn {
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.play-btn { background: var(--accent); color: var(--bg); font-weight: 600; }
.play-btn:hover { box-shadow: 0 0 16px rgba(0,212,255,0.4); }
.play-btn.playing { background: var(--green); }
.fav-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 5px 10px;
}
.fav-btn:hover { border-color: #f59e0b; color: #f59e0b; }
.fav-btn.active { background: rgba(245,158,11,0.1); border-color: #f59e0b; color: #f59e0b; }
.format-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(0,212,255,0.1);
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Search highlight */
.search-highlight { color: #fbbf24; font-weight: 600; }

/* Player Bar */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(15,22,41,0.97);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 200;
  height: 72px;
}
.player-bar .track-info { flex: 1; min-width: 0; }
.player-bar .track-name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.player-bar .track-province {
  font-size: 12px;
  color: var(--text3);
}
.player-controls { display: flex; align-items: center; gap: 8px; }
.player-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  background: var(--surface2);
  color: var(--text);
}
.player-btn:hover { background: var(--border); }
.player-btn.play-pause { background: var(--accent); color: var(--bg); width: 42px; height: 42px; font-size: 18px; }
.player-btn.play-pause:hover { box-shadow: 0 0 20px rgba(0,212,255,0.4); }
.player-progress { flex: 1; max-width: 300px; display: flex; align-items: center; gap: 8px; }
.player-progress input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  outline: none;
}
.player-progress input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,212,255,0.4);
}
.player-progress input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}
.player-time { font-size: 12px; color: var(--text3); min-width: 36px; }
.player-volume { display: flex; align-items: center; gap: 6px; width: 120px; }
.player-volume input[type="range"] {
  width: 80px;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  outline: none;
}
.player-volume input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text2);
  cursor: pointer;
}
.player-volume input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text2);
  cursor: pointer;
  border: none;
}
.player-volume .vol-icon { font-size: 16px; cursor: pointer; user-select: none; }
.company-info { font-size: 11px; color: var(--text3); white-space: nowrap; }

/* Map */
.map-wrapper { height: 100%; display: flex; flex-direction: column; }
.map-container { flex: 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); min-height: 400px; position: relative; }
.map-container .leaflet-container { background: var(--surface); }
.map-legend {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
  padding: 12px 16px; background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border);
}
.map-legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text2); cursor: pointer;
  padding: 3px 10px 3px 6px; border-radius: 6px; transition: all 0.2s;
}
.map-legend-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.map-legend-item .dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.map-legend-item .count { color: var(--text3); }
.map-marker-label {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--text);
  white-space: nowrap; font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.map-marker-label.highlight { border-color: var(--accent); }
.map-marker-count {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--bg); border-radius: 50%;
  width: 22px; height: 22px; font-size: 11px; font-weight: 700; margin-left: 4px;
}

@media (max-width: 768px) {
  .sidebar { width: 200px; min-width: 200px; }
  .content { padding: 16px 12px 120px; }
  .card-grid { grid-template-columns: 1fr; }
  .player-bar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; height: auto; min-height: 64px; }
  .player-progress { max-width: 200px; }
  .player-volume { width: 80px; }
  .player-volume input[type="range"] { width: 50px; }
}
@media (max-width: 600px) {
  .sidebar { display: none; }
  .header { padding: 10px 12px; gap: 8px; }
  .search-box { max-width: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">白泽网络电台 <small>NetRadio</small></div>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索电台或节目...">
  </div>
  <div class="header-actions">
    <button class="header-btn" id="favViewBtn" onclick="toggleFavView()">⭐ 收藏 <span class="fav-count" id="favCount">0</span></button>
    <button class="header-btn" id="homeBtn" onclick="showHome()">🏠 首页</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<footer class="player-bar" id="playerBar">
  <div class="player-controls">
    <button class="player-btn" onclick="playPrev()">⏮</button>
    <button class="player-btn play-pause" id="playPauseBtn" onclick="togglePlay()">▶</button>
    <button class="player-btn" onclick="playNext()">⏭</button>
  </div>
  <div class="track-info">
    <div class="track-name" id="trackName">未选择</div>
    <div class="track-province" id="trackProvince">选择一个电台开始播放</div>
  </div>
  <div class="company-info">笃行白泽（北京）科技有限公司</div>
  <div class="player-progress">
    <span class="player-time" id="currentTime">00:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" oninput="seek(event)">
    <span class="player-time" id="totalTime">00:00</span>
  </div>
  <div class="player-volume">
    <span class="vol-icon" onclick="toggleMute()" id="volIcon">🔊</span>
    <input type="range" id="volBar" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(event)">
  </div>
</footer>

<script>
// ---- State ----
const state = {
  categories: [],
  allStations: [],
  allPodcasts: [],
  currentView: 'stations',
  currentCategory: null,
  currentGeo: null,
  currentPodcastCategory: null,
  searchText: '',
  favorites: [],
  favRefSet: new Set(),
  deviceId: localStorage.getItem('device_id'),
  currentTrack: null,
  playing: false,
  hls: null,
  audio: null,
  showingFavorites: false,
  playQueue: [],
  queueIndex: -1,
};

if (!state.deviceId) {
  state.deviceId = crypto.randomUUID();
  localStorage.setItem('device_id', state.deviceId);
}

const searchInput = document.getElementById('searchInput');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchText = searchInput.value.trim();
    state.showingFavorites = false;
    document.getElementById('favViewBtn').classList.remove('active');
    render();
  }, 300);
});

// ---- Audio Setup ----
const audioEl = document.createElement('audio');
audioEl.style.display = 'none';
document.body.appendChild(audioEl);

function destroyHls() {
  if (state.hls) { try { state.hls.destroy(); } catch(e) {} state.hls = null; }
}

function destroyAudio() {
  if (state.audio) {
    state.audio.pause();
    state.audio.src = '';
    state.audio = null;
  }
}

function playTrack(item) {
  state.currentTrack = item;
  state.showingFavorites = false;
  document.getElementById('favViewBtn').classList.remove('active');
  updatePlayerUI();
  render();

  destroyHls();
  destroyAudio();

  const isHls = item.format === 'hls' || item.url.includes('.m3u8');
  if (isHls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(item.url);
    hls.attachMedia(audioEl);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { audioEl.play().catch(() => {}); });
    state.hls = hls;
    state.audio = audioEl;
  } else {
    audioEl.src = item.url;
    audioEl.play().catch(() => {});
    state.audio = audioEl;
  }

  state.playing = true;
  document.getElementById('playPauseBtn').textContent = '⏸';
  audioEl.volume = parseFloat(document.getElementById('volBar').value);

  audioEl.ontimeupdate = () => {
    if (audioEl.duration) {
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      document.getElementById('seekBar').value = pct;
      document.getElementById('currentTime').textContent = fmtTime(audioEl.currentTime);
      document.getElementById('totalTime').textContent = fmtTime(audioEl.duration);
    }
  };
  audioEl.onended = () => { playNext(); };
  audioEl.onerror = () => { state.playing = false; document.getElementById('playPauseBtn').textContent = '▶'; };
}

function togglePlay() {
  if (!state.audio || !state.currentTrack) return;
  if (state.playing) {
    state.audio.pause();
    state.playing = false;
    document.getElementById('playPauseBtn').textContent = '▶';
  } else {
    state.audio.play().catch(() => {});
    state.playing = true;
    document.getElementById('playPauseBtn').textContent = '⏸';
  }
}

function seek(e) {
  if (!state.audio || !state.audio.duration) return;
  const pct = parseFloat(e.target.value) / 100;
  state.audio.currentTime = pct * state.audio.duration;
}

function setVolume(e) {
  const v = parseFloat(e.target.value);
  if (state.audio) state.audio.volume = v;
  document.getElementById('volIcon').textContent = v === 0 ? '🔇' : v < 0.3 ? '🔈' : v < 0.7 ? '🔉' : '🔊';
}

function toggleMute() {
  const bar = document.getElementById('volBar');
  if (state.audio) {
    if (state.audio.volume > 0) {
      state._prevVol = state.audio.volume;
      state.audio.volume = 0;
      bar.value = 0;
    } else {
      state.audio.volume = state._prevVol || 0.8;
      bar.value = state.audio.volume;
    }
    setVolume({target: bar});
  }
}

function fmtTime(t) {
  if (!t || !isFinite(t)) return '00:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updatePlayerUI() {
  if (state.currentTrack) {
    document.getElementById('trackName').textContent = state.currentTrack.name;
    document.getElementById('trackProvince').textContent = state.currentTrack.province || state.currentTrack.category || '';
  } else {
    document.getElementById('trackName').textContent = '未选择';
    document.getElementById('trackProvince').textContent = '选择一个电台开始播放';
  }
}

function playPrev() {
  if (state.queueIndex > 0) {
    state.queueIndex--;
    playTrack(state.playQueue[state.queueIndex]);
  }
}

function playNext() {
  if (state.queueIndex < state.playQueue.length - 1) {
    state.queueIndex++;
    playTrack(state.playQueue[state.queueIndex]);
  } else {
    destroyHls();
    destroyAudio();
    state.playing = false;
    state.currentTrack = null;
    document.getElementById('playPauseBtn').textContent = '▶';
    updatePlayerUI();
    render();
  }
}

// ---- API ----
async function api(url, opts = {}) {
  try {
    const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } });
    return await res.json();
  } catch(e) { console.error(e); return null; }
}

// ---- Favorites ----
async function loadFavorites() {
  const data = await api(`/api/favorites?device_id=${state.deviceId}`);
  if (data) {
    state.favorites = data.favorites || [];
    state.favRefSet = new Set(state.favorites.map(f => f.ref_id));
    document.getElementById('favCount').textContent = state.favorites.length;
  }
}

async function toggleFavorite(item, e) {
  if (e) e.stopPropagation();
  if (state.favRefSet.has(item.ref_id)) {
    const fav = state.favorites.find(f => f.ref_id === item.ref_id);
    if (fav) {
      await api(`/api/favorites/${fav.id}?device_id=${state.deviceId}`, { method: 'DELETE' });
    }
  } else {
    await api('/api/favorites', {
      method: 'POST',
      body: JSON.stringify({
        device_id: state.deviceId,
        type: item.province ? 'station' : (item.category || 'podcast'),
        ref_id: item.ref_id,
        name: item.name,
        url: item.url,
        category: item.province || item.category || '',
        format: item.format,
      }),
    });
  }
  await loadFavorites();
  render();
}

function toggleFavView() {
  state.showingFavorites = !state.showingFavorites;
  document.getElementById('favViewBtn').classList.toggle('active');
  render();
}

function showHome() {
  state.showingFavorites = false;
  state.searchText = '';
  searchInput.value = '';
  state.currentCategory = null;
  state.currentGeo = null;
  state.currentPodcastCategory = null;
  state.currentView = 'map';
  document.getElementById('favViewBtn').classList.remove('active');
  render();
}

// ---- Render ----
function render() {
  renderSidebar();
  renderContent();
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  // Map view
  const isMapView = state.currentView === 'map' && !state.showingFavorites;
  let html = '<div class="sidebar-section">' +
    `<div class="cat-item ${isMapView ? 'active' : ''}" onclick="showMapView()">
      <span class="arrow">🗺</span>
      <span class="name">地图分布</span>
    </div>` +
  '</div>';
  // Station categories
  html += '<div class="sidebar-section"><div class="sidebar-title">电台列表</div>';
  for (const cat of state.categories) {
    if (cat.type !== 'station') continue;
    const isActive = state.currentView === 'stations' && state.currentCategory === cat.name && !state.showingFavorites;
    const isOpen = isActive;
    html += `<div class="cat-item ${isActive ? 'active' : ''}" onclick="selectCategory('${cat.name}')">
      <span class="arrow ${isOpen ? 'open' : ''}">▸</span>
      <span class="name">${cat.name}</span>
      <span class="badge">${cat.count}</span>
    </div>`;
  }
  html += '</div>';

  // Podcast categories
  html += '<div class="sidebar-section"><div class="sidebar-title">音频内容</div>';
  for (const cat of state.categories) {
    if (cat.type !== 'podcast') continue;
    const isActive = state.currentView === 'podcast' && state.currentPodcastCategory === cat.name && !state.showingFavorites;
    html += `<div class="cat-item ${isActive ? 'active' : ''}" onclick="selectPodcastCategory('${cat.name}')">
      <span class="arrow ${isActive ? 'open' : ''}">▸</span>
      <span class="name">${cat.name}</span>
      <span class="badge">${cat.count}</span>
    </div>`;
  }
  html += '</div>';

  sb.innerHTML = html;
}

function renderContent() {
  const el = document.getElementById('content');

  if (state.showingFavorites) {
    renderFavorites(el);
    return;
  }

  if (state.currentView === 'map') {
    renderMap(el);
    return;
  }

  if (state.currentView === 'stations') {
    renderStations(el);
  } else {
    renderPodcasts(el);
  }
}

function showMapView() {
  state.showingFavorites = false;
  state.currentView = 'map';
  state.currentCategory = null;
  state.currentGeo = null;
  state.currentPodcastCategory = null;
  document.getElementById('favViewBtn').classList.remove('active');
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  render();
}

const colorPalette = [
  '#00d4ff', '#7c3aed', '#f59e0b', '#00ff88', '#ef4444',
  '#ec4899', '#f97316', '#14b8a6', '#8b5cf6', '#06b6d4',
  '#84cc16', '#fb923c', '#a855f7', '#22d3ee', '#fbbf24',
];

let mapInstance = null;
let mapMarkers = [];
let mapLocationData = [];

function renderMap(el) {
  el.innerHTML = '<div class="map-wrapper">' +
    '<div class="content-header"><h2>🗺 电台分布地图</h2><span class="total">正在加载分布数据...</span></div>' +
    '<div class="map-container" id="leafletMap"></div>' +
    '<div class="map-legend" id="mapLegend"></div>' +
  '</div>';

  fetch('/api/station-locations').then(r => r.json()).then(data => {
    mapLocationData = data.locations || [];
    const legendEl = document.getElementById('mapLegend');
    if (!legendEl) return;
    let legendHtml = '';
    const hasUnknown = mapLocationData.some(l => l.name === '未知');
    mapLocationData.forEach((loc, i) => {
      if (loc.name === '未知') return;
      const color = colorPalette[i % colorPalette.length];
      legendHtml += `<div class="map-legend-item" onclick="mapLegendClick('${loc.name}')">
        <span class="dot" style="background:${color}"></span>
        <span>${loc.name}</span>
        <span class="count">${loc.count}</span>
      </div>`;
    });
    if (hasUnknown) {
      legendHtml += `<div class="map-legend-item" onclick="mapLegendClick('未知')" style="opacity:0.5">
        <span class="dot" style="background:#666"></span>
        <span>未知地区</span>
        <span class="count">${mapLocationData.find(l=>l.name==='未知')?.count||0}</span>
      </div>`;
    }
    document.getElementById('mapLegend').innerHTML = legendHtml;
    document.querySelector('.content-header .total').textContent =
      `共 ${mapLocationData.reduce((a,l)=>a+l.count,0)} 个电台`;
    setTimeout(() => initMap(), 100);
  }).catch(() => {
    document.querySelector('.content-header .total').textContent = '加载失败';
  });
}

function mapLegendClick(name) {
  state.showingFavorites = false;
  state.currentView = 'stations';
  state.currentCategory = null;
  state.currentGeo = name;
  state.currentPodcastCategory = null;
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  render();
}

function initMap() {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapMarkers = [];

  const mapEl = document.getElementById('leafletMap');
  if (!mapEl) return;

  mapInstance = L.map(mapEl, {
    center: [30, 108],
    zoom: 4,
    zoomControl: true,
    attributionControl: false,
  });

  const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18, subdomains: 'abcd',
    attribution: '&copy; OSM &copy; CARTO',
  });
  tileLayer.addTo(mapInstance);
  tileLayer.on('tileerror', function() {
    if (!this._fallback) {
      this._fallback = true;
      mapInstance.eachLayer(function(l) { if (l._url && l._url.includes('cartocdn')) mapInstance.removeLayer(l); });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18}).addTo(mapInstance);
    }
  });

  const style = document.createElement('style');
  style.textContent = `
    .leaflet-container { font-family: inherit; background: #0f1629; }
    .leaflet-popup-content-wrapper { background: #1a2340; color: #e8edf5; border: 1px solid #1e2d5a; border-radius: 8px; }
    .leaflet-popup-tip { background: #1a2340; }
    .leaflet-popup-close-button { color: #8892b0 !important; }
    .leaflet-control-zoom a { background: #1a2340 !important; color: #e8edf5 !important; border-color: #1e2d5a !important; }
    .leaflet-control-attribution { background: rgba(15,22,41,0.8) !important; color: #8892b0 !important; }
    .leaflet-control-attribution a { color: #00d4ff !important; }
  `;
  document.head.appendChild(style);

  const bounds = [];
  mapLocationData.forEach((loc, i) => {
    const [lat, lng] = loc.coord;
    const cnt = loc.count;
    const isUnknown = loc.name === '未知';
    if (isUnknown) return;
    const color = colorPalette[i % colorPalette.length];
    const radius = Math.max(12, Math.min(55, cnt * 0.5));

    const marker = L.circleMarker([lat, lng], {
      radius: radius, fillColor: color, color: color,
      weight: 2, opacity: 0.8, fillOpacity: 0.3,
    }).addTo(mapInstance);

    const escName = loc.name.replace(/'/g, "\\'");
    marker.bindPopup(`
      <div style="text-align:center;min-width:120px">
        <div style="font-size:16px;font-weight:700;color:${color};margin-bottom:2px">${loc.name}</div>
        <div style="font-size:24px;font-weight:800">${cnt}</div>
        <div style="font-size:12px;color:#8892b0">个电台</div>
        <div style="margin-top:6px"><a href="#" onclick="parent.mapLegendClick('${escName}');return false" style="color:${color}">查看列表 →</a></div>
      </div>
    `);
    marker.on('click', () => { mapLegendClick(loc.name); });

    const labelIcon = L.divIcon({
      className: 'map-marker-label' + (cnt > 100 ? ' highlight' : ''),
      html: `${loc.name} <span class="map-marker-count">${cnt}</span>`,
      iconSize: [0, 0], iconAnchor: [0, -radius - 8],
    });
    L.marker([lat, lng], { icon: labelIcon, interactive: false }).addTo(mapInstance);
    mapMarkers.push(marker);
    bounds.push([lat, lng]);
  });

  // Unknown marker at Pacific
  const unknown = mapLocationData.find(l => l.name === '未知');
  if (unknown && unknown.count > 0) {
    const [ulat, ulng] = unknown.coord;
    L.circleMarker([ulat, ulng], {
      radius: 8, fillColor: '#666', color: '#666',
      weight: 1, opacity: 0.5, fillOpacity: 0.2,
    }).addTo(mapInstance);
    L.marker([ulat, ulng], {
      icon: L.divIcon({
        className: 'map-marker-label',
        html: `未知 <span class="map-marker-count" style="background:#666">${unknown.count}</span>`,
        iconSize: [0, 0], iconAnchor: [0, -20],
      }),
      interactive: false,
    }).addTo(mapInstance);
  }

  if (bounds.length) {
    mapInstance.fitBounds(bounds, { padding: [50, 50], maxZoom: 5 });
  }
  setTimeout(() => mapInstance.invalidateSize(), 200);
}

function renderStations(el) {
  const cat = state.currentCategory;
  const geo = state.currentGeo;
  const search = state.searchText;
  let items = state.allStations;
  if (cat) items = items.filter(s => s.province === cat);
  if (geo) items = items.filter(s => s.geo_name === geo);
  if (search) { const q = search.toLowerCase(); items = items.filter(s => s.name.toLowerCase().includes(q)); }

  if (!items.length) {
    el.innerHTML = '<div class="content-empty">没有找到匹配的电台</div>';
    return;
  }

  state.playQueue = items;
  state.queueIndex = state.currentTrack ? items.findIndex(s => s.ref_id === state.currentTrack.ref_id) : -1;

  let title = geo || cat || '全部电台';
  let backBtn = '';
  if (geo) {
    backBtn = '<button class="header-btn" onclick="showMapView()" style="margin-right:8px">← 返回地图</button>';
  }
  let html = `<div class="content-header">${backBtn}<h2>${title}</h2><span class="total">${items.length} 个电台</span></div>`;
  html += '<div class="card-grid">';
  for (const item of items) {
    html += renderCard(item);
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderPodcasts(el) {
  const cat = state.currentPodcastCategory;
  const search = state.searchText;
  let items = state.allPodcasts;
  if (cat) items = items.filter(p => p.category === cat);
  if (search) { const q = search.toLowerCase(); items = items.filter(p => p.name.toLowerCase().includes(q)); }

  state.playQueue = items;
  state.queueIndex = state.currentTrack ? items.findIndex(s => s.ref_id === state.currentTrack.ref_id) : -1;

  if (!items.length) {
    el.innerHTML = '<div class="content-empty">没有找到匹配的内容</div>';
    return;
  }

  let html = `<div class="tabs">
    <button class="tab ${(!cat || cat === '相声') ? 'active' : ''}" onclick="selectPodcastCategory('相声')">相声</button>
    <button class="tab ${cat === '脱口秀' ? 'active' : ''}" onclick="selectPodcastCategory('脱口秀')">脱口秀</button>
  </div>`;
  html += `<div class="content-header"><h2>${cat || '全部'}</h2><span class="total">${items.length} 个节目</span></div>`;
  html += '<div class="card-grid">';
  for (const item of items) {
    html += renderCard(item);
  }
  html += '</div>';
  el.innerHTML = html;
}

function selectCategory(name) {
  state.currentView = 'stations';
  state.currentCategory = state.currentCategory === name ? null : name;
  state.currentGeo = null;
  state.currentPodcastCategory = null;
  state.showingFavorites = false;
  document.getElementById('favViewBtn').classList.remove('active');
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  render();
}

function selectPodcastCategory(name) {
  state.currentView = 'podcast';
  state.currentPodcastCategory = state.currentPodcastCategory === name ? null : name;
  state.currentCategory = null;
  state.showingFavorites = false;
  document.getElementById('favViewBtn').classList.remove('active');
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  render();
}

// ---- Init ----
async function init() {
  const [catData, stationData, podcastData] = await Promise.all([
    api('/api/categories'),
    api('/api/stations'),
    api('/api/podcasts'),
  ]);

  state.categories = catData?.categories || [];
  state.allStations = stationData?.stations || [];
  state.allPodcasts = podcastData?.podcasts || [];

  await loadFavorites();
  state.currentView = 'map';
  render();
}

renderCard = function(item) {
  const idx = state.playQueue.indexOf(item);
  if (idx < 0) return '';
  const isPlaying = state.currentTrack && state.currentTrack.ref_id === item.ref_id && state.playing;
  const isFav = state.favRefSet.has(item.ref_id);
  const search = state.searchText;
  let nameHtml = escapeHtml(item.name);
  if (search) {
    const s = search.toLowerCase();
    const n = item.name.toLowerCase();
    const pos = n.indexOf(s);
    if (pos >= 0) {
      nameHtml = escapeHtml(item.name.slice(0, pos)) + '<span class="search-highlight">' + escapeHtml(item.name.slice(pos, pos + search.length)) + '</span>' + escapeHtml(item.name.slice(pos + search.length));
    }
  }
  const metaParts = [];
  if (item.province) metaParts.push(escapeHtml(item.province));
  if (item.category) metaParts.push(escapeHtml(item.category));
  return `<div class="card ${isPlaying ? 'playing' : ''}" onclick="playQueueClick(${idx})">
    <div class="card-name">${nameHtml} <span class="playing-indicator"></span></div>
    <div class="card-meta">${metaParts.join(' · ')} <span class="format-badge">${item.format}</span></div>
    <div class="card-actions">
      <button class="card-btn play-btn ${isPlaying ? 'playing' : ''}" onclick="event.stopPropagation(); playQueueClick(${idx})">${isPlaying ? '⏸ 播放中' : '▶ 播放'}</button>
      <button class="card-btn fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); favClick(${idx})">${isFav ? '⭐' : '☆'}</button>
    </div>
  </div>`;
};

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function playQueueClick(idx) {
  if (idx >= 0 && idx < state.playQueue.length) {
    playTrack(state.playQueue[idx]);
  }
}

function favClick(idx) {
  if (idx >= 0 && idx < state.playQueue.length) {
    toggleFavorite(state.playQueue[idx], null);
  }
}

renderFavorites = function(el) {
  const items = state.favorites;
  if (!items.length) {
    el.innerHTML = '<div class="content-empty">还没有收藏任何电台或节目</div>';
    return;
  }
  state.playQueue = items;
  state.queueIndex = state.currentTrack ? items.findIndex(s => s.ref_id === state.currentTrack.ref_id) : -1;

  let html = '<div class="content-header"><h2>⭐ 我的收藏</h2><span class="total">' + items.length + ' 项</span></div>';
  html += '<div class="card-grid">';
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const isPlaying = state.currentTrack && state.currentTrack.ref_id === item.ref_id && state.playing;
    const nameHtml = escapeHtml(item.name);
    html += `<div class="card ${isPlaying ? 'playing' : ''}" onclick="playQueueClick(${i})">
      <div class="card-name">${nameHtml} <span class="playing-indicator"></span></div>
      <div class="card-meta">${escapeHtml(item.category || '')} <span class="format-badge">${item.format}</span></div>
      <div class="card-actions">
        <button class="card-btn play-btn ${isPlaying ? 'playing' : ''}" onclick="event.stopPropagation(); playQueueClick(${i})">${isPlaying ? '⏸ 播放中' : '▶ 播放'}</button>
        <button class="card-btn fav-btn active" onclick="event.stopPropagation(); unfavClick(${i})">⭐</button>
      </div>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
};

function unfavClick(idx) {
  if (idx >= 0 && idx < state.playQueue.length) {
    toggleFavorite(state.playQueue[idx], null);
  }
}

init();
</script>
</body>
</html>
